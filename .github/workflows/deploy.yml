name: Test and deploy

on:
  push:
    branches: [main]
    # Only changes that alter the image deploy; use apollo-office's manual run for anything else.
    paths: ["src/**", "tests/**", "pyproject.toml", "uv.lock", "Dockerfile"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: vuoreksenapollo
          repositories: apollo-office
      - name: Start the server deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api -X POST repos/vuoreksenapollo/apollo-office/actions/workflows/deploy.yml/dispatches -f ref=main
